name: Publish archive to Pages
on:
  push:
    branches: [main]
    paths: [public-site.zip]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract reviewed public site
        run: |
          mkdir public
          unzip -q public-site.zip -d public
          test -f public/index.html
          test -f public/sitemap.xml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
